<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f0f3f8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="為你股掌" />
  <meta name="description" content="為你股掌 · T-K-Q 多模型股票決策中樞" />
  <link rel="manifest" href="./manifest.json?v=cake7" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/cake-192.png?v=cake7" />
  <link rel="apple-touch-icon" href="./icons/cake-192.png?v=cake7" />
  <title>為你股掌</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/liquid-glass-kit.css?v=lg1" />
  <style>
    :root {
      --bg-base: #f0f3f8;
      --ink-1: #1e293b;
      --ink-2: #475569;
      --ink-3: #64748b;
      --accent-sage: #5b8270;
      --accent-ochre: #8c7042;
      --accent-rose: #a86c72;
      --accent-slate: #62768c;
      --glass-line: rgba(255, 255, 255, 0.78);
      --glass-line-soft: rgba(255, 255, 255, 0.62);
    }

    html {
      overflow-x: clip;
    }

    body {
      min-height: 100dvh;
      overflow-x: clip;
      color: var(--ink-1);
      background-color: var(--bg-base);
      overscroll-behavior-y: contain;
      padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
    }

    ::selection {
      background: rgba(98, 118, 140, 0.22);
      color: var(--ink-1);
    }

    .hidden {
      display: none !important;
    }

    svg {
      display: inline-block;
      vertical-align: middle;
      flex-shrink: 0;
      max-width: 100%;
    }

    .lg-icon-xs { width: 14px; height: 14px; }
    .lg-icon-sm { width: 16px; height: 16px; }
    .lg-icon-md { width: 18px; height: 18px; }

    .num-col,
    .tabular-nums {
      font-family: "Plus Jakarta Sans", "Noto Sans TC", -apple-system, BlinkMacSystemFont, sans-serif !important;
      font-variant-numeric: tabular-nums !important;
      font-feature-settings: "tnum" 1 !important;
    }

    /* 主內容殼層（供 Android 12 邊緣拉伸變形，隔離 fixed 頂層 Portal） */
    #app-shell {
      max-width: 896px;
      margin: 0 auto;
      padding: 12px 12px 36px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      will-change: transform;
    }

    @media (min-width: 640px) {
      #app-shell {
        padding: 16px 16px 40px;
        gap: 14px;
      }
    }

    /* 頂部 Sticky 液態玻璃導覽列 */
    .app-header {
      position: sticky;
      top: calc(10px + env(safe-area-inset-top, 0px));
      z-index: 40;
      border-radius: 26px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-icon-frame {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      background: rgba(255, 255, 255, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.9);
    }

    .brand-icon-frame img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .brand-title {
      margin: 0;
      font-size: 23px;
      line-height: 1.2;
      font-weight: 800;
      color: var(--ink-1);
      white-space: nowrap;
    }

    @media (min-width: 640px) {
      .brand-title {
        font-size: 26px;
      }
    }

    /* 通用玻璃膠囊與按鈕 */
    .lg-pill-surface {
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.68) 0%, rgba(255, 255, 255, 0.44) 100%);
      border: 1px solid var(--glass-line-soft);
      box-shadow:
        inset 0 1px 1px rgba(255, 255, 255, 0.88),
        0 4px 14px -4px rgba(60, 74, 92, 0.06);
    }

    .lg-btn-reset {
      appearance: none;
      border: 1px solid var(--glass-line);
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.66) 0%, rgba(255, 255, 255, 0.42) 100%);
      color: var(--ink-1);
      font: inherit;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 0 14px;
      box-shadow:
        inset 0 1px 1px rgba(255, 255, 255, 0.86),
        0 4px 12px -4px rgba(60, 74, 92, 0.08);
    }

    .lg-btn-muted {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.48);
      background: linear-gradient(135deg, rgba(98, 118, 140, 0.88) 0%, rgba(77, 95, 116, 0.92) 100%);
      color: #ffffff;
      font: inherit;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 0 14px;
      box-shadow:
        inset 0 1px 1px rgba(255, 255, 255, 0.36),
        0 6px 16px -4px rgba(60, 74, 92, 0.24);
    }

    .lg-btn-muted:hover,
    .lg-btn-muted:focus-visible {
      background: linear-gradient(135deg, rgba(86, 106, 128, 0.94) 0%, rgba(67, 84, 104, 0.98) 100%);
    }

    .lg-icon-btn {
      padding: 0;
      width: 48px;
      height: 48px;
      border-radius: 14px;
    }

    .sync-btn {
      padding: 0 14px;
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-2);
      border-radius: 999px;
      white-space: nowrap;
    }

    .sync-dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: var(--accent-sage);
      flex-shrink: 0;
    }

    .sync-dot.is-syncing {
      background: var(--accent-ochre);
      animation: lgPulse 1.1s ease-in-out infinite;
    }

    @keyframes lgPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.82); }
    }

    /* KPI 摘要列 */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    @media (min-width: 640px) {
      .kpi-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
      }
    }

    .kpi-card {
      border-radius: 24px;
      padding: 13px 15px;
      text-align: left;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 6px;
      border: 1px solid rgba(255, 255, 255, 0.76);
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.58) 0%, rgba(255, 255, 255, 0.34) 100%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      backdrop-filter: blur(24px) saturate(180%);
      box-shadow:
        inset 0 1px 1px rgba(255, 255, 255, 0.90),
        0 10px 28px -6px rgba(60, 74, 92, 0.08);
    }

    .kpi-card.is-active-total {
      border-color: rgba(98, 118, 140, 0.65);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.95), 0 0 0 2px rgba(98, 118, 140, 0.25), 0 10px 24px -6px rgba(60, 74, 92, 0.12);
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.78) 0%, rgba(242, 246, 251, 0.58) 100%);
    }

    .kpi-card.is-active-bull {
      border-color: rgba(91, 130, 112, 0.65);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.95), 0 0 0 2px rgba(91, 130, 112, 0.24), 0 10px 24px -6px rgba(91, 130, 112, 0.12);
      background: linear-gradient(145deg, rgba(243, 249, 246, 0.80) 0%, rgba(235, 244, 239, 0.60) 100%);
    }

    .kpi-card.is-active-hold {
      border-color: rgba(140, 112, 66, 0.65);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.95), 0 0 0 2px rgba(140, 112, 66, 0.24), 0 10px 24px -6px rgba(140, 112, 66, 0.12);
      background: linear-gradient(145deg, rgba(251, 248, 242, 0.80) 0%, rgba(247, 241, 230, 0.60) 100%);
    }

    .kpi-card.is-active-sell {
      border-color: rgba(168, 108, 114, 0.65);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.95), 0 0 0 2px rgba(168, 108, 114, 0.24), 0 10px 24px -6px rgba(168, 108, 114, 0.12);
      background: linear-gradient(145deg, rgba(252, 245, 246, 0.80) 0%, rgba(248, 236, 238, 0.60) 100%);
    }

    .kpi-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--ink-3);
      line-height: 1.3;
    }

    .kpi-value-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 6px;
    }

    .kpi-count {
      font-size: 22px;
      font-weight: 800;
      line-height: 1.1;
      color: var(--ink-1);
    }

    .kpi-unit {
      font-size: 11px;
      font-weight: 600;
      color: var(--ink-3);
    }

    .tone-sage { color: var(--accent-sage); }
    .tone-ochre { color: var(--accent-ochre); }
    .tone-rose { color: var(--accent-rose); }
    .tone-slate { color: var(--ink-2); }

    /* 主功能玻璃面板 */
    #mainPanel {
      padding: 14px;
      border-radius: 26px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    @media (min-width: 640px) {
      #mainPanel {
        padding: 18px;
        gap: 14px;
      }
    }

    .toolbar-shell {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.18);
    }

    @media (min-width: 768px) {
      .toolbar-shell {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
      }
    }

    .tab-switch-bar {
      display: inline-flex;
      align-items: center;
      padding: 4px;
      gap: 4px;
      border-radius: 16px;
      background: rgba(203, 213, 225, 0.34);
      border: 1px solid rgba(255, 255, 255, 0.72);
      box-shadow: inset 0 1px 2px rgba(71, 85, 105, 0.08);
      align-self: flex-start;
    }

    .tab-btn {
      appearance: none;
      border: 1px solid transparent;
      background: transparent;
      border-radius: 12px;
      padding: 0 16px;
      font-size: 14px;
      font-weight: 600;
      color: var(--ink-2);
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .tab-btn.is-active {
      background: rgba(255, 255, 255, 0.88);
      border-color: rgba(255, 255, 255, 0.95);
      color: var(--ink-1);
      font-weight: 700;
      box-shadow: 0 3px 10px -2px rgba(60, 74, 92, 0.12);
    }

    .results-toolbar {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
    }

    @media (min-width: 768px) {
      .results-toolbar {
        flex-direction: row;
        align-items: center;
        justify-content: flex-end;
        width: auto;
      }
    }

    .search-box-glass {
      min-height: 48px;
      border-radius: 14px;
      padding: 0 8px 0 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      transition: transform 0.24s var(--ease-spring), box-shadow 0.24s var(--ease-spring), border-color 0.20s ease;
    }

    @media (min-width: 768px) {
      .search-box-glass {
        width: 210px;
      }
    }

    .search-box-glass:focus-within {
      border-color: rgba(255, 255, 255, 0.96);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.95), 0 8px 20px -6px rgba(60, 74, 92, 0.12);
    }

    .search-input {
      width: 100%;
      min-width: 0;
      border: 0;
      background: transparent;
      font-size: 13px;
      font-weight: 500;
      color: var(--ink-1);
      outline: none;
    }

    .search-input::placeholder {
      color: var(--ink-3);
    }

    .btn-clear-search {
      width: 48px;
      height: 48px;
      min-width: 48px;
      min-height: 48px;
      border: 0;
      background: transparent;
      color: var(--ink-3);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      flex-shrink: 0;
    }

    .filter-grid {
      display: grid;
      grid-template-columns: 0.90fr 0.94fr 1.16fr;
      gap: 6px;
      width: 100%;
    }

    @media (min-width: 768px) {
      .filter-grid {
        grid-template-columns: repeat(3, auto);
        width: auto;
      }
    }

    .filter-trigger {
      width: 100%;
      min-height: 48px;
      min-width: 48px;
      border-radius: 14px;
      padding: 0 9px;
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-1);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      border: 1px solid var(--glass-line);
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.66) 0%, rgba(255, 255, 255, 0.42) 100%);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.88), 0 4px 12px -4px rgba(60, 74, 92, 0.06);
    }

    .filter-trigger-label {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: left;
    }

    .chevron-icon {
      transition: transform 0.34s var(--ease-spring);
      color: var(--ink-3);
      flex-shrink: 0;
    }

    .is-open-trigger .chevron-icon,
    .chevron-icon.is-rotated {
      transform: rotate(180deg);
    }

    /* 排行榜工具列 */
    .leaderboard-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    @media (min-width: 768px) {
      .leaderboard-toolbar {
        justify-content: flex-end;
        gap: 8px;
      }
    }

    .lb-market-switch {
      display: inline-flex;
      align-items: center;
      padding: 3px;
      gap: 3px;
      border-radius: 14px;
      background: rgba(203, 213, 225, 0.34);
      border: 1px solid rgba(255, 255, 255, 0.72);
    }

    .lb-market-btn {
      appearance: none;
      border: 1px solid transparent;
      background: transparent;
      border-radius: 11px;
      padding: 0 10px;
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-2);
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    #lbTradeDateBadge {
      font-size: 11px;
      padding: 4px 8px;
    }

    .lb-market-btn.is-active {
      background: rgba(255, 255, 255, 0.88);
      border-color: rgba(255, 255, 255, 0.95);
      color: var(--ink-1);
      font-weight: 700;
      box-shadow: 0 2px 8px -2px rgba(60, 74, 92, 0.12);
    }

    /* 卡片列表容器 */
    .cards-stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .stock-card {
      border-radius: 20px;
      padding: 13px;
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.68) 0%, rgba(255, 255, 255, 0.44) 100%);
      border: 1px solid rgba(255, 255, 255, 0.84);
      box-shadow:
        inset 0 1px 1px rgba(255, 255, 255, 0.92),
        0 6px 20px -6px rgba(60, 74, 92, 0.08);
      transition: transform 0.24s var(--ease-spring), box-shadow 0.24s var(--ease-spring), border-color 0.20s ease;
    }

    .stock-card.is-highlighted {
      box-shadow:
        inset 0 1px 1px rgba(255, 255, 255, 0.95),
        0 0 0 2px rgba(98, 118, 140, 0.48),
        0 12px 26px -6px rgba(60, 74, 92, 0.14);
    }

    @media (min-width: 640px) {
      .stock-card {
        padding: 15px;
      }
    }

    .card-header-toggle {
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 48px;
    }

    .card-top-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .card-title-block {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
      flex: 1;
    }

    .card-code-name {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .stock-name {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      color: var(--ink-1);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .card-badges-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }

    .card-price-block {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
      flex-shrink: 0;
    }

    .price-main {
      font-size: 15px;
      font-weight: 800;
      color: var(--ink-1);
    }

    .price-chg {
      font-size: 12px;
      font-weight: 600;
    }

    .card-meta-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .kronos-pill-stat {
      font-size: 12px;
      color: var(--ink-2);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .card-action-group {
      display: flex;
      align-items: center;
      gap: 6px;
      width: 100%;
    }

    @media (min-width: 640px) {
      .card-action-group {
        width: auto;
      }
    }

    .card-pdf-btn {
      flex: 1;
      font-size: 12px;
      font-weight: 600;
      border-radius: 999px;
      white-space: nowrap;
      padding: 0 12px;
    }

    @media (min-width: 640px) {
      .card-pdf-btn {
        flex: initial;
      }
    }

    .card-chevron-indicator {
      width: 48px;
      height: 48px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--ink-3);
      flex-shrink: 0;
      border: 1px solid rgba(255, 255, 255, 0.72);
      background: rgba(255, 255, 255, 0.42);
    }

    .card-date-strip {
      margin-top: 10px;
      border-radius: 14px;
      padding: 8px 12px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      font-size: 11px;
      color: var(--ink-2);
      background: rgba(255, 255, 255, 0.46);
      border: 1px solid rgba(255, 255, 255, 0.68);
    }

    /* 手風琴展開區（0.42s） */
    .accordion-shell {
      margin-top: 0;
      transition:
        grid-template-rows 0.42s var(--ease-spring),
        opacity 0.30s var(--ease-spring),
        transform 0.42s var(--ease-spring),
        margin-top 0.42s var(--ease-spring);
    }

    .accordion-shell.is-open {
      margin-top: 10px;
    }

    .drawer-inner {
      padding-top: 10px;
      border-top: 1px solid rgba(148, 163, 184, 0.18);
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: 12px;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    @media (min-width: 768px) {
      .metrics-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }

    .models-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }

    @media (min-width: 768px) {
      .models-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    .sub-glass-tile {
      border-radius: 16px;
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.56);
      border: 1px solid rgba(255, 255, 255, 0.78);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.88);
    }

    .sub-tile-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--ink-3);
      margin-bottom: 3px;
    }

    .sub-tile-value {
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-1);
      line-height: 1.45;
    }

    .model-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 5px;
    }

    .model-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--ink-1);
    }

    .model-note {
      margin: 0;
      font-size: 11px;
      line-height: 1.55;
      color: var(--ink-2);
    }

    .kronos-chart-box {
      border-radius: 18px;
      padding: 10px;
      background: rgba(255, 255, 255, 0.58);

    function escapeHtml(val) {
      return String(val ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function sanitizeUrl(url) {
      const raw = String(url || "").trim();
      if (!raw) return "";
      if (raw.startsWith("https://") || raw.startsWith("http://")) return raw;
      return "";
    }

    function formatZhDate(tradeDateStr, updatedAtStr) {
      const raw = tradeDateStr || (updatedAtStr ? String(updatedAtStr).slice(0, 10) : "");
      if (!raw) return "近期";
      const m = String(raw).match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
      if (m) {
        return `${m[1]}年${Number(m[2])}月${Number(m[3])}日`;
      }
      return raw;
    }

    function formatRatingZh(ratingStr) {
      if (!ratingStr) return "持有";
      const s = String(ratingStr).replace(/[\(（][A-Za-z\s\/-]+[\)）]/g, "").trim();
      if (s === "減碼／偏低配" || s === "減碼/偏低配") return "減碼";
      return s || ratingStr;
    }

    function classifyRating(ratingText = "") {
      const s = String(ratingText);
      if (s.includes("買進") || s.includes("加碼") || s.includes("Buy") || s.includes("Overweight") || s.includes("偏多")) {
        return { key: "BUY", cls: "badge-buy" };
      }
      if (s.includes("賣出") || s.includes("減碼") || s.includes("Sell") || s.includes("Underweight") || s.includes("偏空")) {
        return { key: "SELL", cls: "badge-sell" };
      }
      return { key: "HOLD", cls: "badge-hold" };
    }

    function sideBadgeClass(side = "") {
      if (side.includes("多")) return "badge-buy";
      if (side.includes("空")) return "badge-sell";
      return "badge-hold";
    }

    function getKronosImageUrl(url) {
      const safe = sanitizeUrl(url);
      if (!safe) return "";
      const m = safe.match(/\/d\/([A-Za-z0-9_-]+)/);
      if (m) {
        return `https://lh3.googleusercontent.com/d/${m[1]}`;
      }
      return safe;
    }

    function getTaipeiDateStr(isoOrDateStr) {
      if (!isoOrDateStr) return "";
      const d = new Date(isoOrDateStr);
      if (isNaN(d.getTime())) {
        return String(isoOrDateStr).slice(0, 10);
      }
      const utc = d.getTime() + (d.getTimezoneOffset() * 60000);
      const taipei = new Date(utc + (3600000 * 8));
      const y = taipei.getFullYear();
      const m = String(taipei.getMonth() + 1).padStart(2, "0");
      const day = String(taipei.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function getThisWeekMondayFriday() {
      const now = new Date();
      const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
      const taipeiNow = new Date(utc + (3600000 * 8));
      const day = taipeiNow.getDay();
      const diffToMonday = day === 0 ? 6 : day - 1;
      const monday = new Date(taipeiNow);
      monday.setDate(taipeiNow.getDate() - diffToMonday);
      const friday = new Date(monday);
      friday.setDate(monday.getDate() + 4);

      const formatYMD = (d) => {
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, "0");
        const date = String(d.getDate()).padStart(2, "0");
        return `${y}-${m}-${date}`;
      };
      return { monday: formatYMD(monday), friday: formatYMD(friday) };
    }

    function isAnalyzedThisWeek(record) {
      const { monday, friday } = getThisWeekMondayFriday();
      const analysisDate = getTaipeiDateStr(record.updated_at) || record.trade_date || "";
      return analysisDate >= monday && analysisDate <= friday;
    }

    function getDeduplicatedRecords(allRecords) {
      const map = new Map();
      for (const r of allRecords) {
        const key = (r.code || r.yf || "").toUpperCase();
        if (!key) continue;
        if (!map.has(key)) {
          map.set(key, r);
        } else {
          const prev = map.get(key);
          const prevDate = `${prev.trade_date || ""} ${prev.updated_at || ""}`;
          const curDate = `${r.trade_date || ""} ${r.updated_at || ""}`;
          if (curDate > prevDate) {
            map.set(key, r);
          }
        }
      }
      return Array.from(map.values());
    }

    function positionPortalMenu(menu, anchorEl) {
      const rect = anchorEl.getBoundingClientRect();
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      const minW = menu.dataset.portalMenu === "sort" ? 174 : 152;
      const width = Math.min(vw - 20, Math.max(rect.width, minW));
      const left = Math.min(Math.max(10, rect.left), vw - width - 10);

      menu.style.width = `${width}px`;
      menu.style.left = `${left}px`;

      const estHeight = 220;
      if (rect.bottom + 8 + estHeight > vh - 16 && rect.top > estHeight) {
        menu.style.top = "auto";
        menu.style.bottom = `${vh - rect.top + 8}px`;
      } else {
        menu.style.bottom = "auto";
        menu.style.top = `${rect.bottom + 8}px`;
      }
    }

    function closePortalMenu(menu) {
      if (!menu || menu.classList.contains("hidden")) return;
      const acc = menu.querySelector(".lg-accordion");
      if (acc) acc.classList.remove("is-open");
      menu.classList.remove("lg-pop-enter");
      menu.classList.add("lg-pop-exit");
      menu.setAttribute("aria-hidden", "true");

      const prevTimer = closeTimers.get(menu);
      if (prevTimer) clearTimeout(prevTimer);
      const t = setTimeout(() => {
        menu.classList.add("hidden");
        menu.classList.remove("lg-pop-exit");
      }, 220);
      closeTimers.set(menu, t);
    }

    function closeAllDropdowns(exceptName = null) {
      document.querySelectorAll(".lg-portal-dropdown").forEach((menu) => {
        if (menu.dataset.portalMenu !== exceptName) {
          closePortalMenu(menu);
        }
      });
      document.querySelectorAll(".dropdown-anchor").forEach((anchor) => {
        const name = DROPDOWN_MAP[anchor.id];
        if (name !== exceptName) {
          anchor.classList.remove("is-open-trigger");
          const btn = anchor.querySelector(".filter-trigger");
          if (btn) btn.setAttribute("aria-expanded", "false");
        }
      });
      if (!exceptName) {
        activePortalName = null;
        activeAnchorEl = null;
      }
    }

    function toggleDropdown(anchorEl) {
      const name = DROPDOWN_MAP[anchorEl.id];
      const menu = document.querySelector(`.lg-portal-dropdown[data-portal-menu="${name}"]`);
      if (!menu) return;

      const isCurrentlyOpen = !menu.classList.contains("hidden") && !menu.classList.contains("lg-pop-exit");
      closeAllDropdowns(isCurrentlyOpen ? null : name);
      if (isCurrentlyOpen) return;

      const prevTimer = closeTimers.get(menu);
      if (prevTimer) clearTimeout(prevTimer);

      activePortalName = name;
      activeAnchorEl = anchorEl;

      menu.classList.remove("hidden", "lg-pop-exit");
      menu.classList.add("lg-pop-enter");
      menu.setAttribute("aria-hidden", "false");
      positionPortalMenu(menu, anchorEl);

      anchorEl.classList.add("is-open-trigger");
      const triggerBtn = anchorEl.querySelector(".filter-trigger");
      if (triggerBtn) triggerBtn.setAttribute("aria-expanded", "true");

      const acc = menu.querySelector(".lg-accordion");
      if (acc) {
        acc.classList.remove("is-open");
        void acc.offsetHeight;
        acc.classList.add("is-open");
      }
    }

      if (toastTimer) clearTimeout(toastTimer);

    async function copyToClipboard(text) {
      const val = String(text || "").trim();
      if (!val) return;
      let copied = false;
      if (navigator.clipboard && window.isSecureContext) {
        try {
          await navigator.clipboard.writeText(val);
          copied = true;
        } catch (_) {}
      }
      if (!copied) {
        try {
          const ta = document.createElement("textarea");
          ta.value = val;
          ta.setAttribute("readonly", "");
          ta.style.position = "fixed";
          ta.style.top = "0";
          ta.style.left = "-9999px";
          document.body.appendChild(ta);
          ta.focus();
          ta.select();
          copied = document.execCommand("copy");
          document.body.removeChild(ta);
        } catch (_) {}
      }
      showToast(copied ? `已複製 ${val}` : `代號 ${val}`);
    }

        else holdCount++;

      document.getElementById("kpiTotalCount").textContent = thisWeekRecords.length;

    async function fetchOverviewState(forceSync = false) {
      const syncDot = document.getElementById("syncDot");
      const syncText = document.getElementById("syncStatusText");
      if (syncDot && syncText) {
        syncDot.classList.add("is-syncing");
        syncText.textContent = "同步中";
      }

      // 1. GitHub Pages 靜態 overview.json
      try {
        const res = await fetch(`./overview.json?t=${Date.now()}`, { cache: "no-store" });
        if (res.ok) {
          const data = await res.json();
          if (data && Array.isArray(data.records) && data.records.length > 0) {
            state.records = data.records;
            renderOverview();
          }
          if (syncDot && syncText) {
            syncDot.classList.remove("is-syncing");
            syncText.textContent = "已同步";
          }
          return;
        }
      } catch (_) {}

      // 2. 本地 server.py API 支援（含 queue.json 與 overview.json 契約）
      try {
        const res = await fetch(`./api/overview${forceSync ? "?sync=1" : ""}`, { cache: "no-store" });
        if (res.ok) {
          const data = await res.json();
          if (data && data.overview && Array.isArray(data.overview.records) && data.overview.records.length > 0) {
            state.records = data.overview.records;
            renderOverview();
          }
          if (syncDot && syncText) {
            syncDot.classList.remove("is-syncing");
            syncText.textContent = "已連線";
          }
          return;
        }
      } catch (_) {}

      // 3. Google Apps Script 橋接備援
      if (state.gasUrl) {
        try {
          const res = await fetch(`${state.gasUrl}?action=overview`, { cache: "no-store" });
          if (res.ok) {
            const data = await res.json();
            if (data && data.overview && Array.isArray(data.overview.records)) {
              state.records = data.overview.records;
              renderOverview();
            }
            if (syncDot && syncText) {
              syncDot.classList.remove("is-syncing");
              syncText.textContent = "已連線 GAS";
            }
            return;
          }
        } catch (_) {}
      }

      if (syncDot && syncText) {
        syncDot.classList.remove("is-syncing");
        syncText.textContent = "已同步";
      }
    }

    function updateDropdownSelected(attrName, val) {
      document.querySelectorAll(`[${attrName}]`).forEach((btn) => {
        btn.classList.toggle("is-selected", btn.getAttribute(attrName) === val);
      });
    }

    function initEvents() {
      const filterInput = document.getElementById("stockFilterInput");
      const clearFilterBtn = document.getElementById("btnClearFilter");
      if (filterInput) {
        filterInput.addEventListener("input", (e) => {
          state.filterQuery = e.target.value.trim().toLowerCase();
          if (clearFilterBtn) clearFilterBtn.classList.toggle("hidden", !state.filterQuery);
          renderOverview();
        });
      }
      if (clearFilterBtn) {
        clearFilterBtn.addEventListener("click", () => {
          filterInput.value = "";
          state.filterQuery = "";
          clearFilterBtn.classList.add("hidden");
          filterInput.focus();
          renderOverview();
        });
      }

      ["filterMarketAnchor", "filterRatingAnchor", "filterSortAnchor"].forEach((id) => {
        const anchor = document.getElementById(id);
        if (anchor) {
          anchor.querySelector(".filter-trigger").addEventListener("click", (e) => {
            e.stopPropagation();
            toggleDropdown(anchor);
          });
        }
      });

      document.querySelectorAll("[data-filter-market]").forEach((btn) => {
        btn.addEventListener("click", () => {
          state.filterMarket = btn.getAttribute("data-filter-market");
          document.getElementById("filterMarketLabel").textContent = btn.textContent.trim();
          updateDropdownSelected("data-filter-market", state.filterMarket);
          closeAllDropdowns();
          renderOverview();
        });
      });

      document.querySelectorAll("[data-filter-rating]").forEach((btn) => {
        btn.addEventListener("click", () => {
          state.filterRating = btn.getAttribute("data-filter-rating");
          state.filterThisWeekOnly = false;
          document.getElementById("filterRatingLabel").textContent = btn.textContent.trim();
          updateDropdownSelected("data-filter-rating", state.filterRating);
          closeAllDropdowns();
          renderOverview();
        });
      });

      document.querySelectorAll("[data-filter-sort]").forEach((btn) => {
        btn.addEventListener("click", () => {
          state.filterSort = btn.getAttribute("data-filter-sort");
          document.getElementById("filterSortLabel").textContent = btn.textContent.trim();
          updateDropdownSelected("data-filter-sort", state.filterSort);
          closeAllDropdowns();
          renderOverview();
        });
      });

      const tabBtnRes = document.getElementById("tabBtnResults");
      const tabBtnLb = document.getElementById("tabBtnLeaderboard");
      if (tabBtnRes) tabBtnRes.addEventListener("click", () => setActiveTab("results"));
      if (tabBtnLb) tabBtnLb.addEventListener("click", () => setActiveTab("leaderboard"));

      const lbBtnTw = document.getElementById("lbMarketBtnTW");
      const lbBtnUs = document.getElementById("lbMarketBtnUS");
      if (lbBtnTw) lbBtnTw.addEventListener("click", () => setLeaderboardMarket("TW"));
      if (lbBtnUs) lbBtnUs.addEventListener("click", () => setLeaderboardMarket("US"));

      const cardTotal = document.getElementById("kpiCardTotal");
      if (cardTotal) {
        cardTotal.addEventListener("click", () => {
          const fromLb = state.activeTab !== "results";
          if (fromLb) {
            state.filterThisWeekOnly = true;
            state.filterRating = "ALL";
            document.getElementById("filterRatingLabel").textContent = "全部評級";
            updateDropdownSelected("data-filter-rating", "ALL");
            setActiveTab("results");
          } else {
            state.filterThisWeekOnly = !state.filterThisWeekOnly;
            if (state.filterThisWeekOnly) {
              state.filterRating = "ALL";
              document.getElementById("filterRatingLabel").textContent = "全部評級";
              updateDropdownSelected("data-filter-rating", "ALL");
            }
          }
          renderOverview();
        });
      }

      const kpiRatingMap = [
        { id: "kpiCardBull", key: "BUY", label: "買進 / 偏多" },
        { id: "kpiCardHold", key: "HOLD", label: "持有 / 觀望" },
        { id: "kpiCardBear", key: "SELL", label: "減碼 / 賣出" }
      ];
      kpiRatingMap.forEach(({ id, key, label }) => {
        const card = document.getElementById(id);
        if (!card) return;
        card.addEventListener("click", () => {
          const fromLb = state.activeTab !== "results";
          if (!fromLb && state.filterRating === key && !state.filterThisWeekOnly) {
            state.filterRating = "ALL";
            document.getElementById("filterRatingLabel").textContent = "全部評級";
          } else {
            state.filterRating = key;
            state.filterThisWeekOnly = false;
            document.getElementById("filterRatingLabel").textContent = label;
            if (fromLb) setActiveTab("results");
          }
          updateDropdownSelected("data-filter-rating", state.filterRating);
          renderOverview();
        });
      });

      const modal = document.getElementById("kronosModal");
      const closeModalBtn = document.getElementById("btnCloseKronosModal");
      if (closeModalBtn) {
        closeModalBtn.addEventListener("click", closeKronosModal);
      }
      if (modal) {
        modal.addEventListener("click", (e) => {
          if (e.target === modal) closeKronosModal();
        });
        modal.addEventListener("cancel", (e) => {
          e.preventDefault();
          closeKronosModal();
        });
      }

      const btnSync = document.getElementById("btnSyncNow");
      if (btnSync) {
        btnSync.addEventListener("click", async () => {
          if ("serviceWorker" in navigator) {
            try {
              const reg = await navigator.serviceWorker.getRegistration();
              if (reg) await reg.update();
            } catch (_) {}
          }
          await Promise.all([fetchOverviewState(true), fetchLeaderboard()]);
        });
      }

      window.addEventListener("beforeinstallprompt", (e) => {
        e.preventDefault();
        state.deferredPrompt = e;
      });

      if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
        let refreshing = false;
        navigator.serviceWorker.addEventListener("controllerchange", () => {
          if (!refreshing) {
            refreshing = true;
            window.location.reload();
          }
        });
        navigator.serviceWorker.register("./sw.js?v=cake9").then((reg) => {
          reg.update();
        }).catch(() => {});
      }
    }

    initEvents();
    renderOverview();
    fetchOverviewState(false);
    fetchLeaderboard();
    setInterval(() => {
      fetchOverviewState(false);
      fetchLeaderboard();
    }, 60000);
  </script>
</body>
</html>
